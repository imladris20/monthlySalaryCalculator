<!doctype html>
<html lang="zh-TW" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>實領薪資計算機</title>

    <!-- 引入 DaisyUI (必須在 Tailwind 之前) -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@latest/daisyui.css"
      rel="stylesheet"
      type="text/css"
    />
    <!-- 引入 Tailwind CSS v4 Browser CDN -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>

    <!-- 自訂樣式 (如有需要) -->
    <link href="style.css" rel="stylesheet" />
  </head>
  <body
    class="min-h-screen bg-base-200 flex items-start justify-center p-4 pt-10 md:p-8 font-sans transition-colors duration-300"
  >
    <div
      class="card w-full max-w-lg bg-base-100 shadow-xl border border-base-300"
    >
      <div class="card-body">
        <h2
          class="card-title text-2xl font-bold mb-6 text-primary flex items-center gap-2"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-6 w-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
            />
          </svg>
          實領薪資計算機
        </h2>

        <form id="calculator-form" class="space-y-4">
          <!-- 月薪輸入 -->
          <div class="form-control">
            <label class="label">
              <span class="label-text font-medium">月薪 (新台幣)</span>
            </label>
            <label
              class="input input-bordered flex items-center gap-2 focus-within:outline-primary"
            >
              $
              <input
                type="number"
                id="monthly-salary"
                class="grow"
                placeholder="例如: 40000"
                required
                min="1"
              />
            </label>
            <div
              id="salary-insurance-preview"
              class="text-xs text-base-content/60 mt-2 min-h-[1rem]"
            ></div>
          </div>

          <!-- 加班紀錄列表 -->
          <div class="form-control">
            <div class="flex justify-between items-end mb-2">
              <label class="label p-0">
                <span class="label-text font-medium">每日加班紀錄 (分鐘)</span>
              </label>
              <button
                type="button"
                id="add-record-btn"
                class="btn btn-sm btn-outline btn-secondary"
              >
                + 新增一日
              </button>
            </div>

            <div id="records-container" class="space-y-3">
              <!-- 動態插入的輸入列 -->
              <div class="flex items-center gap-2 record-row">
                <input
                  type="number"
                  class="input input-bordered w-full focus:outline-primary overtime-minutes"
                  placeholder="例如: 120"
                  step="1"
                  required
                  min="1"
                  max="240"
                />
                <button
                  type="button"
                  class="btn btn-square btn-error btn-outline delete-btn"
                  title="刪除"
                  disabled
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="h-5 w-5"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M6 18L18 6M6 6l12 12"
                    />
                  </svg>
                </button>
              </div>
            </div>
          </div>

          <div class="card-actions mt-6">
            <button type="submit" class="btn btn-primary w-full text-lg">
              開始計算
            </button>
          </div>
        </form>

        <div class="divider my-6">計算結果</div>

        <!-- 結果顯示區塊 -->
        <div id="result-section" class="hidden space-y-4 animate-fade-in">
          <!-- 扣除額與加班費細項 -->
          <div class="stats shadow w-full bg-base-200 mt-2">
            <div class="stat place-items-center">
              <div class="stat-title text-base-content/70">勞健保扣除額</div>
              <div
                class="stat-value text-xl text-error"
                id="insurance-deduction"
              >
                - NT$ 0
              </div>
              <div class="stat-desc text-xs mt-1" id="insurance-desc">
                依級距表扣除
              </div>
            </div>
            <div class="stat place-items-center">
              <div class="stat-title text-base-content/70">總加班費</div>
              <div
                class="stat-value text-xl text-success"
                id="overtime-pay-exact"
              >
                + NT$ 0.00
              </div>
              <div
                class="stat-desc text-xs mt-1"
                id="overtime-tier1-desc"
              ></div>
              <div class="stat-desc text-xs" id="overtime-tier2-desc"></div>
            </div>
          </div>

          <!-- 最終實領薪資 -->
          <div
            class="alert alert-success shadow-lg mt-4 flex-col items-start gap-1 bg-gradient-to-r from-success/20 to-success/40 border-none"
          >
            <div class="flex items-center gap-2">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="stroke-current shrink-0 h-6 w-6 text-success-content"
                fill="none"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"
                />
              </svg>
              <h3 class="font-bold text-lg text-success-content">
                最終實領薪資
              </h3>
            </div>
            <div class="w-full text-success-content">
              <div class="text-sm opacity-80 mt-1">
                公式：帳面薪資 - 扣除額 + 加班費
              </div>
              <div
                class="text-5xl font-black mt-2 tracking-tight"
                id="net-salary-rounded"
              >
                NT$ 0
              </div>
            </div>
          </div>

          <!-- 雇主提撥勞退 -->
          <div
            class="alert shadow-sm mt-4 flex-col items-start gap-1 bg-info/10 text-info border-none"
          >
            <div class="flex items-center gap-2">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                class="stroke-current shrink-0 w-6 h-6"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                ></path>
              </svg>
              <h3 class="font-bold text-lg">雇主提撥勞退 (6%)</h3>
            </div>
            <div class="w-full">
              <div class="text-3xl font-black mt-1" id="employer-pension">
                NT$ 0
              </div>
              <div class="text-xs opacity-80 mt-1" id="employer-pension-desc">
                這筆錢會由雇主全額負擔並存入您的勞退個人專戶，不包含在上方實領薪資內。
              </div>
            </div>
          </div>

          <p class="text-xs text-base-content/60 text-center mt-4">
            *
            計算結果僅供參考，實際薪資發放依各公司計算方式及最新勞基法規定為準。
          </p>
        </div>
      </div>
    </div>

    <script src="insuranceData.js"></script>
    <script src="script.js"></script>
  </body>
</html>
